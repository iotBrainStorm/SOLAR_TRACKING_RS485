<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solar Monitor Dashboard</title>
    <link rel="icon" type="image/svg+xml" href="dashboard.svg" />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", sans-serif;
      }

      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
        color: white;
      }

      .container {
        flex: 1; /* pushes footer down */
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
      }

      .header {
        text-align: center;
        margin-bottom: 40px;
        animation: fadeSlide 1s ease forwards;
      }

      .main-title {
        font-size: 36px;
        font-weight: 700;
        letter-spacing: 1px;
        background: linear-gradient(90deg, #00f2fe, #4facfe);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-shadow: 0 0 20px rgba(79, 172, 254, 0.4);
        margin-bottom: 8px;
      }

      .subtitle {
        font-size: 14px;
        color: rgba(255, 255, 255, 0.7);
        letter-spacing: 2px;
        text-transform: uppercase;
      }

      /* Minimal smooth animation */
      @keyframes fadeSlide {
        from {
          opacity: 0;
          transform: translateY(-20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .header h1 {
        font-size: 32px;
        font-weight: 600;
        letter-spacing: 1px;
      }

      .dashboard {
        display: flex;
        flex-wrap: wrap;
        justify-content: center; /* Centers each row */
        gap: 25px;
      }

      .card {
        flex: 0 0 300px;
        max-width: 300px;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 20px;
        padding: 25px;
        text-align: center;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        transition: transform 0.3s ease;
      }

      .card:hover {
        transform: translateY(-2px);
      }

      .card-sub {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 6px;
        margin-top: 10px;
        padding: 8px 12px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 8px;
        contain: layout paint; /* Isolates humidity text repaints */
      }

      .card-sub .sub-icon {
        font-size: 16px;
      }

      .card-sub .sub-value {
        font-size: 18px;
        font-weight: 600;
        color: #91a2ff;
      }

      .card-sub .sub-unit {
        font-size: 12px;
        opacity: 0.6;
      }

      .icon {
        font-size: 40px;
        margin-bottom: 15px;
      }

      .title {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 1px;
        margin-bottom: 12px;
        text-transform: uppercase;
        background: linear-gradient(90deg, #ffffff, #cfd9df);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        position: relative;
      }

      /* Elegant underline */
      .title::after {
        content: "";
        display: block;
        width: 40px;
        height: 2px;
        margin: 8px auto 0;
        background: linear-gradient(90deg, #4facfe, #00f2fe);
        border-radius: 2px;
        opacity: 0.8;
      }

      .value {
        font-size: 36px;
        font-weight: bold;
        letter-spacing: 1px;
        contain: layout paint; /* Isolates temperature text repaints */
      }

      .unit {
        font-size: 16px;
        opacity: 0.7;
      }

      .footer {
        text-align: center;
        margin-top: 100px;
        padding: 15px 10px;
        font-size: 13px;
        opacity: 0.7;
      }
      /* Settings Button (top right) */
      .setup-btn {
        position: fixed;
        top: 18px;
        right: 20px;
        width: 42px;
        height: 42px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: rgba(255, 255, 255, 0.6);
        cursor: pointer;
        transition: color 0.3s ease;
        z-index: 1000;
        box-shadow: none;
        -webkit-tap-highlight-color: transparent;
        outline: none;
      }

      .setup-btn:hover {
        color: #4facfe;
      }

      .setup-btn:active {
        color: #00f2fe;
        box-shadow: none;
        outline: none;
      }

      .setup-btn svg {
        width: 22px;
        height: 22px;
        fill: currentColor;
      }

      /* Sun Map Card */
      .sun-map-card {
        flex: 0 0 100%;
        max-width: 630px;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 20px;
        padding: 25px 25px 15px;
        text-align: center;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        transition: transform 0.3s ease;
      }

      .sun-map-card:hover {
        transform: translateY(-2px);
      }

      .sun-arc-container {
        position: relative;
        width: 100%;
        height: 170px;
        margin: 10px 0 5px;
        overflow: hidden;
      }

      .sun-arc-svg {
        width: 100%;
        height: 100%;
      }

      .sun-times {
        display: flex;
        justify-content: space-between;
        font-size: 13px;
        color: rgba(255, 255, 255, 0.8);
        padding: 0 10px;
        margin-top: 2px;
      }

      .sun-times .sun-label {
        font-size: 11px;
        opacity: 0.6;
        display: block;
      }

      .sun-times .sun-time {
        font-size: 16px;
        font-weight: 600;
      }

      /* Sun glow pulse animation */
      @keyframes sunPulse {
        0%,
        100% {
          r: 10;
          opacity: 0.15;
        }
        50% {
          r: 14;
          opacity: 0.25;
        }
      }

      @keyframes sunPulseOuter {
        0%,
        100% {
          r: 17;
          opacity: 0.06;
        }
        50% {
          r: 22;
          opacity: 0.12;
        }
      }

      #sunGlow {
        animation: sunPulse 2s ease-in-out infinite;
      }

      #sunGlowOuter {
        animation: sunPulseOuter 2.5s ease-in-out infinite;
      }

      .sun-glow-off #sunGlow,
      .sun-glow-off #sunGlowOuter {
        animation: none;
      }

      /* Sun stats row */
      .sun-stats {
        display: flex;
        justify-content: space-around;
        margin-top: 12px;
        padding: 10px 5px;
        background: rgba(255, 255, 255, 0.06);
        border-radius: 10px;
      }

      .sun-stat-item {
        text-align: center;
        flex: 1;
      }

      .sun-stat-item .stat-value {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.5px;
      }

      .sun-stat-item .stat-label {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 1px;
        opacity: 0.5;
        margin-top: 2px;
      }

      .sun-stat-divider {
        width: 1px;
        background: rgba(255, 255, 255, 0.15);
        margin: 2px 0;
      }

      .lux-arrow {
        font-size: 0.65em;
        margin-left: 3px;
        vertical-align: middle;
        transition: opacity 0.3s ease;
      }

      .lux-arrow.up {
        color: #2ecc71;
      }

      .lux-arrow.down {
        color: #fc513e;
      }

      /* Responsive: Tablet */
      @media (max-width: 768px) {
        .container {
          padding: 15px 12px;
        }

        .header {
          margin-bottom: 25px;
        }

        .main-title {
          font-size: 28px;
        }

        .subtitle {
          font-size: 12px;
          letter-spacing: 1.5px;
        }

        .dashboard {
          gap: 16px;
        }

        .card {
          flex: 1 1 calc(50% - 10px);
          max-width: calc(50% - 10px);
          min-width: 200px;
          padding: 20px;
        }

        .icon {
          font-size: 34px;
          margin-bottom: 10px;
        }

        .value {
          font-size: 30px;
        }

        .card-sub .sub-value {
          font-size: 16px;
        }

        .sun-map-card {
          flex: 0 0 100%;
          max-width: 100%;
          padding: 20px 16px 12px;
        }

        .sun-arc-container {
          height: 155px;
        }

        .sun-times {
          padding: 0 8px;
        }

        .sun-times .sun-time {
          font-size: 15px;
        }

        .sun-stats {
          padding: 10px 8px;
        }

        .sun-stat-item .stat-value {
          font-size: 17px;
        }

        .sun-stat-item .stat-label {
          font-size: 9px;
          letter-spacing: 0.8px;
        }

        .setup-btn {
          top: 14px;
          right: 14px;
          width: 38px;
          height: 38px;
        }

        .setup-btn svg {
          width: 20px;
          height: 20px;
        }

        .footer {
          margin-top: 50px;
          font-size: 11px;
        }
      }

      /* Responsive: Mobile */
      @media (max-width: 480px) {
        .container {
          padding: 12px 8px;
        }

        .header {
          margin-bottom: 18px;
        }

        .main-title {
          font-size: 20px;
        }

        .subtitle {
          font-size: 10px;
          letter-spacing: 1px;
        }

        .dashboard {
          gap: 12px;
        }

        .card {
          flex: 0 0 100%;
          max-width: 100%;
          padding: 16px;
          border-radius: 14px;
        }

        .icon {
          font-size: 28px;
          margin-bottom: 8px;
        }

        .title {
          font-size: 13px;
          margin-bottom: 8px;
        }

        .value {
          font-size: 26px;
        }

        .unit {
          font-size: 13px;
        }

        .sun-map-card {
          padding: 14px 10px 10px;
          border-radius: 14px;
        }

        .sun-arc-container {
          height: 130px;
        }

        .sun-times .sun-time {
          font-size: 14px;
        }

        .sun-times .sun-label {
          font-size: 10px;
        }

        .sun-stats {
          padding: 8px 3px;
          gap: 2px;
        }

        .sun-stat-item .stat-value {
          font-size: 14px;
        }

        .sun-stat-item .stat-label {
          font-size: 8px;
          letter-spacing: 0.5px;
        }

        .setup-btn {
          top: 12px;
          right: 12px;
          width: 36px;
          height: 36px;
          border-radius: 10px;
        }

        .setup-btn svg {
          width: 18px;
          height: 18px;
        }

        .footer {
          margin-top: 35px;
          font-size: 10px;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="header">
        <h1 class="main-title">Solar Monitoring Dashboard</h1>
        <div class="subtitle">Real-Time Device Analytics</div>
      </div>

      <div class="dashboard">
        <div class="card">
          <div class="icon">🌡️</div>
          <div class="title">Outside Temperature</div>
          <div class="value" id="outsideTemp">
            -- <span class="unit">°C</span>
          </div>
          <div class="card-sub">
            <span class="sub-icon">💧</span>
            <span class="sub-value" id="humidity">--</span>
            <span class="sub-unit">%</span>
          </div>
        </div>

        <div class="card">
          <div class="icon">🔥</div>
          <div class="title">Solar Plate Temperature</div>
          <div class="value" id="solarTemp">
            -- <span class="unit">°C</span>
          </div>
        </div>

        <!-- Sun Map -->
        <div class="sun-map-card">
          <div class="title">Sun Map</div>
          <div class="sun-arc-container">
            <svg
              class="sun-arc-svg"
              viewBox="0 0 300 150"
              preserveAspectRatio="xMidYMid meet"
            >
              <defs>
                <radialGradient id="sunGlowGrad" cx="50%" cy="50%" r="50%">
                  <stop offset="0%" stop-color="#ffcc00" stop-opacity="0.6" />
                  <stop offset="100%" stop-color="#ffcc00" stop-opacity="0" />
                </radialGradient>
                <!-- Clip path for Mini Earth Globe (increased radius r=30) -->
                <clipPath id="earthClip">
                  <circle cx="0" cy="0" r="30" />
                </clipPath>
                <!-- Subtle sunlit atmospheric gradient for Earth day side -->
                <radialGradient id="earthDayGrad" cx="50%" cy="50%" r="60%">
                  <stop offset="0%" stop-color="#ffe066" stop-opacity="0.22" />
                  <stop offset="55%" stop-color="#4facfe" stop-opacity="0.16" />
                  <stop
                    offset="100%"
                    stop-color="#0f2027"
                    stop-opacity="0.25"
                  />
                </radialGradient>
              </defs>
              <!-- Azimuth direction label (top left) -->
              <text
                id="azimuthLabel"
                x="5"
                y="14"
                fill="rgba(255,255,255,0.5)"
                font-size="11"
                font-family="Segoe UI, sans-serif"
                font-weight="600"
                letter-spacing="0.5"
              >
                --
              </text>
              <!-- Mini compass with plus shape (top right) -> Mini Earth Globe -->
              <g id="compassGroup" transform="translate(320, 45) scale(1.18)">
                <!-- Clipped Earth interior: Day/Night zones + Latitudes & Longitudes + Sun Path -->
                <g clip-path="url(#earthClip)">
                  <!-- Base Earth ocean/daylight fill -->
                  <circle
                    cx="0"
                    cy="0"
                    r="30"
                    fill="rgba(79, 172, 254, 0.14)"
                  />
                  <circle cx="0" cy="0" r="30" fill="url(#earthDayGrad)" />

                  <!-- Live 3D Day & Night hemisphere group -->
                  <g id="earthDayNightGroup">
                    <!-- Night shadow area (recalculated 3D spherical projection) -->
                    <path
                      id="earthNightPath"
                      d="M -31 0 L 31 0 L 31 31 L -31 31 Z"
                      fill="rgba(5, 11, 18, 0.68)"
                    />
                    <!-- Twilight terminator curve -->
                    <path
                      id="earthTerminator"
                      d="M -31 0 L 31 0"
                      fill="none"
                      stroke="rgba(255, 195, 75, 0.4)"
                      stroke-width="0.7"
                    />
                  </g>

                  <!-- Background Longitudes (Meridians) -->
                  <ellipse
                    cx="0"
                    cy="0"
                    rx="9.5"
                    ry="30"
                    fill="none"
                    stroke="rgba(255,255,255,0.14)"
                    stroke-width="0.38"
                  />
                  <ellipse
                    cx="0"
                    cy="0"
                    rx="18.5"
                    ry="30"
                    fill="none"
                    stroke="rgba(255,255,255,0.14)"
                    stroke-width="0.38"
                  />
                  <ellipse
                    cx="0"
                    cy="0"
                    rx="25.5"
                    ry="30"
                    fill="none"
                    stroke="rgba(255,255,255,0.12)"
                    stroke-width="0.35"
                  />
                  <!-- Current Location Vertical Axis (Local Meridian) -->
                  <line
                    x1="0"
                    y1="-30"
                    x2="0"
                    y2="30"
                    stroke="rgba(255,255,255,0.22)"
                    stroke-width="0.45"
                    stroke-dasharray="1.5, 1.5"
                  />

                  <!-- Latitudes (Horizontal Parallels - Earth rotates horizontally only) -->
                  <line
                    x1="-30"
                    y1="-23.5"
                    x2="30"
                    y2="-23.5"
                    stroke="rgba(255,255,255,0.12)"
                    stroke-width="0.35"
                  />
                  <line
                    x1="-30"
                    y1="-16.5"
                    x2="30"
                    y2="-16.5"
                    stroke="rgba(255,255,255,0.15)"
                    stroke-width="0.38"
                  />
                  <line
                    x1="-30"
                    y1="-8.5"
                    x2="30"
                    y2="-8.5"
                    stroke="rgba(255,255,255,0.15)"
                    stroke-width="0.38"
                  />
                  <line
                    x1="-30"
                    y1="8.5"
                    x2="30"
                    y2="8.5"
                    stroke="rgba(255,255,255,0.15)"
                    stroke-width="0.38"
                  />
                  <line
                    x1="-30"
                    y1="16.5"
                    x2="30"
                    y2="16.5"
                    stroke="rgba(255,255,255,0.15)"
                    stroke-width="0.38"
                  />
                  <line
                    x1="-30"
                    y1="23.5"
                    x2="30"
                    y2="23.5"
                    stroke="rgba(255,255,255,0.12)"
                    stroke-width="0.35"
                  />

                  <!-- Prime Meridian (0° Longitude - Red, relative to current location) -->
                  <path
                    id="primeMeridianPath"
                    d="M 0 -30 L 0 30"
                    fill="none"
                    stroke="rgba(255, 75, 75, 0.8)"
                    stroke-width="0.65"
                  />

                  <!-- Equator (0° Latitude - Fixed Horizontal Red Line) -->
                  <line
                    id="equatorLine"
                    x1="-30"
                    y1="0"
                    x2="30"
                    y2="0"
                    stroke="rgba(255, 75, 75, 0.8)"
                    stroke-width="0.65"
                  />

                  <!-- Recalculated Non-Circular Sun Travelling Path (Daytime trajectory) -->
                  <path
                    id="earthSunPath"
                    d="M 0 0"
                    fill="none"
                    stroke="rgba(255, 204, 0, 0.28)"
                    stroke-width="0.55"
                    stroke-dasharray="1.5, 1.5"
                  />
                  <!-- Active Traveled Sun Path (Sunrise to Now) -->
                  <path
                    id="earthSunPathActive"
                    d="M 0 0"
                    fill="none"
                    stroke="rgba(255, 204, 0, 0.7)"
                    stroke-width="0.75"
                  />
                </g>

                <!-- Outer Earth perimeter ring -->
                <circle
                  cx="0"
                  cy="0"
                  r="30"
                  fill="none"
                  stroke="rgba(255,255,255,0.3)"
                  stroke-width="0.75"
                />

                <!-- N E S W just outside the circle -->
                <text
                  x="0"
                  y="-32.2"
                  text-anchor="middle"
                  fill="rgba(255,100,100,0.9)"
                  font-size="6.5"
                  font-family="Segoe UI, sans-serif"
                  font-weight="700"
                >
                  N
                </text>
                <text
                  x="0"
                  y="37.2"
                  text-anchor="middle"
                  fill="rgba(255,255,255,0.45)"
                  font-size="6.5"
                  font-family="Segoe UI, sans-serif"
                  font-weight="600"
                >
                  S
                </text>
                <text
                  x="33.2"
                  y="2.2"
                  text-anchor="middle"
                  fill="rgba(255,255,255,0.45)"
                  font-size="6.5"
                  font-family="Segoe UI, sans-serif"
                  font-weight="600"
                >
                  E
                </text>
                <text
                  x="-33.5"
                  y="2.2"
                  text-anchor="middle"
                  fill="rgba(255,255,255,0.45)"
                  font-size="6.5"
                  font-family="Segoe UI, sans-serif"
                  font-weight="600"
                >
                  W
                </text>

                <!-- Thin dotted line from saved location (green dot) to Sun dot -->
                <line
                  id="compassRadiusLine"
                  x1="0"
                  y1="0"
                  x2="0"
                  y2="-21"
                  stroke="rgba(255, 204, 0, 0.7)"
                  stroke-width="0.6"
                  stroke-dasharray="1.2, 1.4"
                  opacity="0.85"
                />

                <!-- Current Saved Location (small green dot on vertical axis, above/below Equator) -->
                <circle
                  id="locationHalo"
                  cx="0"
                  cy="0"
                  r="3.2"
                  fill="rgba(46, 204, 113, 0.24)"
                />
                <circle
                  id="locationDot"
                  cx="0"
                  cy="0"
                  r="1.7"
                  fill="#2ecc71"
                  stroke="rgba(0,0,0,0.45)"
                  stroke-width="0.3"
                />

                <!-- Current Sun position dot (yellow) -->
                <circle
                  id="compassDot"
                  cx="0"
                  cy="-21"
                  r="1.8"
                  fill="#ffcc00"
                  stroke="rgba(0,0,0,0.4)"
                  stroke-width="0.3"
                  opacity="0.95"
                />
              </g>
              <!-- Optimal sunlight zone (exact Bezier match between 45° diagonal axes) -->
              <path
                id="optimalZonePath"
                d="M 150 140 L 82.5 72.5 Q 150 27.5 217.5 72.5 Z"
                fill="rgba(255,70,70,0.06)"
              />
              <!-- Horizon line (solid) -->
              <line
                x1="15"
                y1="140"
                x2="285"
                y2="140"
                stroke="rgba(255,255,255,0.2)"
                stroke-width="1"
              />
              <!-- Left 45° diagonal dotted axis (from center to t=0.25 on arc) -->
              <line
                id="line45Left"
                x1="150"
                y1="140"
                x2="82.5"
                y2="72.5"
                stroke="rgba(255,120,120,0.25)"
                stroke-width="1"
                stroke-dasharray="3,4"
              />
              <!-- Right 45° diagonal dotted axis (from center to t=0.75 on arc) -->
              <line
                id="line45Right"
                x1="150"
                y1="140"
                x2="217.5"
                y2="72.5"
                stroke="rgba(255,120,120,0.25)"
                stroke-width="1"
                stroke-dasharray="3,4"
              />
              <!-- Left 45° time label (rotated along line direction) -->
              <text
                id="time45Left"
                x="116"
                y="106"
                text-anchor="middle"
                fill="rgba(255,255,255,0.45)"
                font-size="8"
                font-family="Segoe UI, sans-serif"
                transform="rotate(45, 116, 106)"
              >
                --:--
              </text>
              <!-- Right 45° time label (rotated along line direction) -->
              <text
                id="time45Right"
                x="184"
                y="106"
                text-anchor="middle"
                fill="rgba(255,255,255,0.45)"
                font-size="8"
                font-family="Segoe UI, sans-serif"
                transform="rotate(-45, 184, 106)"
              >
                --:--
              </text>
              <!-- Solar Noon vertical dotted axis -->
              <line
                x1="150"
                y1="140"
                x2="150"
                y2="10"
                stroke="rgba(255,255,255,0.15)"
                stroke-width="1"
                stroke-dasharray="3,4"
              />
              <!-- Horizon center: Current Saved Location (small green dot) -->
              <circle cx="150" cy="140" r="4" fill="rgba(46, 204, 113, 0.25)" />
              <circle
                cx="150"
                cy="140"
                r="2.2"
                fill="#2ecc71"
                stroke="rgba(0,0,0,0.45)"
                stroke-width="0.4"
              />
              <!-- Arc path (dashed) -->
              <path
                id="sunArc"
                d="M 15 140 Q 150 -40 285 140"
                fill="none"
                stroke="rgba(255,255,255,0.15)"
                stroke-width="1.5"
                stroke-dasharray="3,3"
              />
              <!-- Traveled arc (colored) -->
              <path
                id="sunArcActive"
                d="M 15 140 Q 150 -40 285 140"
                fill="none"
                stroke="#ffcc00"
                stroke-width="2"
                stroke-dasharray="0"
                opacity="0.5"
              />
              <!-- Outer glow -->
              <circle
                id="sunGlowOuter"
                cx="15"
                cy="140"
                r="17"
                fill="url(#sunGlowGrad)"
                opacity="0.06"
              />
              <!-- Inner glow -->
              <circle
                id="sunGlow"
                cx="15"
                cy="140"
                r="10"
                fill="#ffcc00"
                opacity="0.15"
              />
              <!-- Sun dot -->
              <circle
                id="sunDot"
                cx="15"
                cy="140"
                r="5"
                fill="#ffcc00"
                opacity="0.9"
              />
            </svg>
          </div>
          <div class="sun-times">
            <div>
              <span class="sun-label">Sunrise</span>
              <span class="sun-time" id="sunriseTime">--:--</span>
            </div>
            <div style="text-align: center">
              <span class="sun-label">Solar Noon</span>
              <span class="sun-time" id="solarNoonTime">--:--</span>
            </div>
            <div style="text-align: right">
              <span class="sun-label">Sunset</span>
              <span class="sun-time" id="sunsetTime">--:--</span>
            </div>
          </div>
          <!-- Stats row -->
          <div class="sun-stats">
            <div class="sun-stat-item">
              <div class="stat-value" id="sunMapAngle" style="color: #ff9f43">
                --°
              </div>
              <div class="stat-label">Sun Angle</div>
            </div>
            <div class="sun-stat-divider"></div>
            <div class="sun-stat-item">
              <div class="stat-value" id="sunMapPercent" style="color: #ffcc00">
                --%
              </div>
              <div class="stat-label">Sunlight</div>
            </div>
            <div class="sun-stat-divider"></div>
            <div class="sun-stat-item">
              <div class="stat-value" id="sunMapLux" style="color: #6dd3fc">
                -- lx <span id="luxArrow" class="lux-arrow"></span>
              </div>
              <div class="stat-label">Lux</div>
            </div>
            <div class="sun-stat-divider"></div>
            <div class="sun-stat-item">
              <div class="stat-value" id="sunRemaining" style="color: #a29bfe">
                --
              </div>
              <div class="stat-label">Remaining</div>
            </div>
          </div>
        </div>
      </div>

      <div class="footer">
        <div style="margin-bottom: 8px">
          <span id="dateTime"></span>
        </div>
        <div>ESP32 Real-time Solar Monitor Dashboard | Developer © M.Maity</div>
      </div>
    </div>

    <script>
      var selectedTZ = 5.5; // default; updated from sensor data
      var prevLux = null; // track previous lux for trend arrow
      var isFetchingSensor = false;

      function getTimeInTZ(tzOffsetHours) {
        var now = new Date();
        var utcMs = now.getTime() + now.getTimezoneOffset() * 60000;
        return new Date(utcMs + tzOffsetHours * 3600000);
      }

      function updateDashboard() {
        if (isFetchingSensor) return;
        isFetchingSensor = true;

        var controller = new AbortController();
        var timeoutId = setTimeout(function () {
          controller.abort();
        }, 1800);

        fetch("/sensor.json", { signal: controller.signal, cache: "no-store" })
          .then(function (res) {
            if (!res.ok) throw new Error("No response");
            return res.json();
          })
          .then(function (data) {
            let outside = parseFloat(data.ahtTemp) || 0;
            let solar = parseFloat(data.ntcTemp) || 0;
            let hum = parseFloat(data.humidity) || 0;
            let sunPercent = parseFloat(data.sunlight) || 0;
            let lux = parseFloat(data.lux) || 0;

            let tPrec =
              data.tempPrecision !== undefined ? data.tempPrecision : 2;
            let hPrec = data.humPrecision !== undefined ? data.humPrecision : 2;

            setValue("outsideTemp", outside.toFixed(tPrec), "°C");
            setValue("solarTemp", solar.toFixed(tPrec), "°C");

            var humEl = document.getElementById("humidity");
            var humStr = hum.toFixed(hPrec);
            if (humEl.textContent !== humStr) {
              humEl.textContent = humStr;
            }

            colorOutsideTemp(outside);
            colorSolarTemp(solar);

            var lat = parseFloat(data.latitude) || 0;
            var lon = parseFloat(data.longitude) || 0;
            var tz =
              data.tzOffset !== undefined ? parseFloat(data.tzOffset) : 5.5;
            if (isNaN(tz)) tz = 5.5;
            selectedTZ = tz;

            updateSunMap(
              data.sunrise,
              data.sunset,
              data.sunriseMin,
              data.sunsetMin,
              sunPercent,
              lux,
              lat,
              lon,
              tz,
            );
          })
          .catch(function () {
            // Keep UI stable on transient packet drop
          })
          .finally(function () {
            clearTimeout(timeoutId);
            isFetchingSensor = false;
          });
      }

      function setValue(id, value, unit) {
        var el = document.getElementById(id);
        var newHtml = value + ' <span class="unit">' + unit + "</span>";
        if (el.innerHTML !== newHtml) {
          el.innerHTML = newHtml;
        }
      }

      function colorOutsideTemp(val) {
        let el = document.getElementById("outsideTemp");
        if (el.style.color !== "rgb(255, 120, 89)") {
          el.style.color = "#FF7859";
        }
      }

      function colorSolarTemp(val) {
        let el = document.getElementById("solarTemp");
        if (el.style.color !== "rgb(207, 145, 255)") {
          el.style.color = "#CF91FF";
        }
      }

      updateDashboard();
      setInterval(updateDashboard, 2000);

      function updateDateTime() {
        const now = getTimeInTZ(selectedTZ);

        const yr = now.getFullYear();
        const months = [
          "Jan",
          "Feb",
          "Mar",
          "Apr",
          "May",
          "Jun",
          "Jul",
          "Aug",
          "Sep",
          "Oct",
          "Nov",
          "Dec",
        ];
        const mon = months[now.getMonth()];
        const day = now.getDate();
        const hh = String(now.getHours()).padStart(2, "0");
        const mm = String(now.getMinutes()).padStart(2, "0");
        const ss = String(now.getSeconds()).padStart(2, "0");

        const tzH = Math.floor(Math.abs(selectedTZ));
        const tzM = Math.round((Math.abs(selectedTZ) - tzH) * 60);
        const tzSign = selectedTZ >= 0 ? "+" : "-";
        const tzLabel =
          "UTC" +
          tzSign +
          String(tzH).padStart(2, "0") +
          ":" +
          String(tzM).padStart(2, "0");

        document.getElementById("dateTime").innerText =
          day +
          " " +
          mon +
          " " +
          yr +
          ", " +
          hh +
          ":" +
          mm +
          ":" +
          ss +
          " (" +
          tzLabel +
          ")";
      }

      updateDateTime();
      setInterval(updateDateTime, 1000);

      function openSetup() {
        window.location.href = "config.html";
      }

      function calcSunPosition(lat, lon, tz, dateObj) {
        // Use UTC date diff to avoid any local DST/timezone skew on dayOfYear
        var yr = dateObj.getFullYear();
        var utcToday = Date.UTC(yr, dateObj.getMonth(), dateObj.getDate());
        var utcYearStart = Date.UTC(yr, 0, 0);
        var dayOfYear = Math.floor((utcToday - utcYearStart) / 86400000);

        var isLeap = (yr % 4 === 0 && yr % 100 !== 0) || yr % 400 === 0;
        var daysInYear = isLeap ? 366.0 : 365.0;

        var hour =
          dateObj.getHours() +
          dateObj.getMinutes() / 60.0 +
          dateObj.getSeconds() / 3600.0;

        var gamma =
          ((2.0 * Math.PI) / daysInYear) *
          (dayOfYear - 1 + (hour - 12.0) / 24.0);

        var eqTime =
          229.18 *
          (0.000075 +
            0.001868 * Math.cos(gamma) -
            0.032077 * Math.sin(gamma) -
            0.014615 * Math.cos(2 * gamma) -
            0.040849 * Math.sin(2 * gamma));

        var decl =
          0.006918 -
          0.399912 * Math.cos(gamma) +
          0.070257 * Math.sin(gamma) -
          0.006758 * Math.cos(2 * gamma) +
          0.000907 * Math.sin(2 * gamma) -
          0.002697 * Math.cos(3 * gamma) +
          0.00148 * Math.sin(3 * gamma);

        var timeOffset = eqTime + 4.0 * lon - 60.0 * tz;

        var tst =
          dateObj.getHours() * 60.0 +
          dateObj.getMinutes() +
          dateObj.getSeconds() / 60.0 +
          timeOffset;

        var ha = tst / 4.0 - 180.0;
        var haRad = (ha * Math.PI) / 180.0;
        var latRad = (lat * Math.PI) / 180.0;

        var cosZenith =
          Math.sin(latRad) * Math.sin(decl) +
          Math.cos(latRad) * Math.cos(decl) * Math.cos(haRad);
        cosZenith = Math.max(-1, Math.min(1, cosZenith));
        var zenith = Math.acos(cosZenith);
        var elevation = 90.0 - (zenith * 180.0) / Math.PI;

        var azimuth =
          (Math.atan2(
            Math.sin(haRad),
            Math.cos(haRad) * Math.sin(latRad) -
              Math.tan(decl) * Math.cos(latRad),
          ) *
            180.0) /
            Math.PI +
          180.0;
        azimuth = ((azimuth % 360.0) + 360.0) % 360.0;

        return {
          elevation: elevation,
          azimuth: azimuth,
          decl: decl,
          haRad: haRad,
        };
      }

      function azimuthToDir(az) {
        var dirs = ["N", "NE", "E", "SE", "S", "SW", "W", "NW"];
        var normAz = ((az % 360) + 360) % 360;
        var idx = Math.round(normAz / 45) % 8;
        return dirs[idx];
      }

      function findAngleCrossingTime(
        lat,
        lon,
        tz,
        targetAngle,
        sunriseMin,
        sunsetMin,
        noonMin,
        direction,
      ) {
        var today = getTimeInTZ(tz);
        var yr = today.getFullYear();
        var mo = today.getMonth();
        var dy = today.getDate();

        var startMin = direction === "rising" ? sunriseMin : noonMin;
        var endMin = direction === "rising" ? noonMin : sunsetMin;

        // Floating-point binary search prevents Math.round boundary lock
        for (var i = 0; i < 16; i++) {
          var midMin = (startMin + endMin) / 2.0;
          var totalSec = Math.round(midMin * 60);
          var d = new Date(
            yr,
            mo,
            dy,
            Math.floor(totalSec / 3600),
            Math.floor((totalSec % 3600) / 60),
            totalSec % 60,
          );
          var elev = calcSunPosition(lat, lon, tz, d).elevation;
          if (elev < targetAngle) {
            if (direction === "rising") startMin = midMin;
            else endMin = midMin;
          } else {
            if (direction === "rising") endMin = midMin;
            else startMin = midMin;
          }
        }
        return Math.round((startMin + endMin) / 2.0);
      }

      function formatMin(m) {
        var total = ((Math.round(m) % 1440) + 1440) % 1440;
        var h = Math.floor(total / 60);
        var mm = total % 60;
        return (h < 10 ? "0" : "") + h + ":" + (mm < 10 ? "0" : "") + mm;
      }

      // Computes non-circular Sun coordinates on the globe relative to off-center Green Dot (0, yLoc)
      function calcEarthSunPoint(azDeg, elevDeg, yLoc, maxOrbitR) {
        var azRad = (azDeg * Math.PI) / 180.0;
        var sinA = Math.sin(azRad);
        var cosA = Math.cos(azRad);

        // Distance from (0, yLoc) to the outer orbit boundary of radius maxOrbitR in direction azRad
        var disc = Math.max(
          0,
          maxOrbitR * maxOrbitR - yLoc * yLoc * sinA * sinA,
        );
        var rBoundary = yLoc * cosA + Math.sqrt(disc);

        // Modulate radius by solar elevation so higher elevation pulls the path inward (non-circular arc)
        var elevClamped = Math.max(0, Math.min(89, elevDeg));
        var elevRad = (elevClamped * Math.PI) / 180.0;
        var r = rBoundary * (0.42 + 0.52 * Math.cos(elevRad));

        return {
          x: r * sinA,
          y: yLoc - r * cosA,
        };
      }

      function updateSunMap(
        sunriseStr,
        sunsetStr,
        sunriseMin,
        sunsetMin,
        sunPercent,
        lux,
        lat,
        lon,
        tz,
      ) {
        document.getElementById("sunriseTime").textContent =
          sunriseStr || "--:--";
        document.getElementById("sunsetTime").textContent =
          sunsetStr || "--:--";

        var validSunTimes =
          sunriseMin !== undefined &&
          sunsetMin !== undefined &&
          sunriseMin >= 0 &&
          sunsetMin > sunriseMin;

        var noonMin = -1;
        var left45 = -1;
        var right45 = -1;
        var hasOptimalZone = false;

        var optPath = document.getElementById("optimalZonePath");
        var line45L = document.getElementById("line45Left");
        var line45R = document.getElementById("line45Right");

        if (validSunTimes) {
          noonMin = Math.round((sunriseMin + sunsetMin) / 2);
          document.getElementById("solarNoonTime").textContent =
            formatMin(noonMin);

          var today = getTimeInTZ(tz);
          var noonDate = new Date(
            today.getFullYear(),
            today.getMonth(),
            today.getDate(),
            Math.floor(noonMin / 60),
            noonMin % 60,
            0,
          );
          var maxElev = calcSunPosition(lat, lon, tz, noonDate).elevation;

          if (maxElev >= 45) {
            hasOptimalZone = true;
            left45 = findAngleCrossingTime(
              lat,
              lon,
              tz,
              45,
              sunriseMin,
              sunsetMin,
              noonMin,
              "rising",
            );
            right45 = findAngleCrossingTime(
              lat,
              lon,
              tz,
              45,
              sunriseMin,
              sunsetMin,
              noonMin,
              "setting",
            );
            document.getElementById("time45Left").textContent =
              formatMin(left45);
            document.getElementById("time45Right").textContent =
              formatMin(right45);
            if (optPath) optPath.style.display = "";
            if (line45L) line45L.style.display = "";
            if (line45R) line45R.style.display = "";
          } else {
            document.getElementById("time45Left").textContent = "--:--";
            document.getElementById("time45Right").textContent = "--:--";
            if (optPath) optPath.style.display = "none";
            if (line45L) line45L.style.display = "none";
            if (line45R) line45R.style.display = "none";
          }
        } else {
          document.getElementById("solarNoonTime").textContent = "--:--";
          document.getElementById("time45Left").textContent = "--:--";
          document.getElementById("time45Right").textContent = "--:--";
        }

        var svgEl = document.querySelector(".sun-arc-svg");

        document.getElementById("sunMapPercent").textContent =
          sunPercent != null ? Math.round(sunPercent) + "%" : "--%";
        var luxText = lux != null ? Math.round(lux) + " lx" : "-- lx";
        var arrowHtml = '<span id="luxArrow" class="lux-arrow"></span>';
        if (lux != null && prevLux != null) {
          if (lux > prevLux) {
            arrowHtml =
              '<span id="luxArrow" class="lux-arrow up">&#9650;</span>';
          } else if (lux < prevLux) {
            arrowHtml =
              '<span id="luxArrow" class="lux-arrow down">&#9660;</span>';
          }
        }
        document.getElementById("sunMapLux").innerHTML =
          luxText + " " + arrowHtml;
        prevLux = lux;

        if (!validSunTimes) {
          document.getElementById("sunRemaining").textContent = "--";
          document.getElementById("sunMapAngle").textContent = "--°";
          return;
        }

        var now = getTimeInTZ(tz);
        var nowMin =
          now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60.0;
        var totalDay = sunsetMin - sunriseMin;
        var progress = 0;

        var sunDot = document.getElementById("sunDot");
        var sunGlow = document.getElementById("sunGlow");
        var sunGlowOuter = document.getElementById("sunGlowOuter");
        var arcActive = document.getElementById("sunArcActive");
        var remainEl = document.getElementById("sunRemaining");

        if (nowMin < sunriseMin) {
          var totalMins = sunsetMin - sunriseMin;
          remainEl.textContent =
            Math.floor(totalMins / 60) + "h " + (totalMins % 60) + "m";
          progress = 0;
        } else if (nowMin >= sunsetMin) {
          remainEl.textContent = "Set";
          progress = 1;
        } else {
          var minsLeft = Math.ceil(sunsetMin - nowMin);
          remainEl.textContent =
            Math.floor(minsLeft / 60) + "h " + (minsLeft % 60) + "m";

          // Piecewise progress so live Sun Dot aligns with the 45° lines & Solar Noon
          if (
            hasOptimalZone &&
            left45 > sunriseMin &&
            right45 < sunsetMin &&
            right45 > left45
          ) {
            if (nowMin <= left45) {
              progress = 0.25 * ((nowMin - sunriseMin) / (left45 - sunriseMin));
            } else if (nowMin <= noonMin) {
              progress = 0.25 + 0.25 * ((nowMin - left45) / (noonMin - left45));
            } else if (nowMin <= right45) {
              progress =
                0.5 + 0.25 * ((nowMin - noonMin) / (right45 - noonMin));
            } else {
              progress =
                0.75 + 0.25 * ((nowMin - right45) / (sunsetMin - right45));
            }
          } else {
            progress = (nowMin - sunriseMin) / totalDay;
          }
        }

        var sunPos = calcSunPosition(lat, lon, tz, now);
        var sunAngle = Math.max(0, sunPos.elevation);
        var sunAzimuth = sunPos.azimuth;
        document.getElementById("sunMapAngle").textContent =
          Math.round(sunAngle) + "°";

        var dirStr = azimuthToDir(sunAzimuth);
        document.getElementById("azimuthLabel").textContent =
          dirStr + " " + Math.round(sunAzimuth) + "°";

        // --- MINI EARTH GLOBE UPDATES ---
        var earthR = 30.0;
        var latRad = (lat * Math.PI) / 180.0;

        // 1. Saved Location (Green Dot): fixed on vertical axis (x=0), above/below Equator (y=0)
        var yLoc = -earthR * Math.sin(latRad);
        yLoc = Math.max(-25.0, Math.min(25.0, yLoc));
        var locDot = document.getElementById("locationDot");
        var locHalo = document.getElementById("locationHalo");
        if (locDot) locDot.setAttribute("cy", yLoc.toFixed(2));
        if (locHalo) locHalo.setAttribute("cy", yLoc.toFixed(2));

        // 2. Red Prime Meridian (0° Longitude) relative to current saved longitude
        var pmPath = document.getElementById("primeMeridianPath");
        if (pmPath) {
          var deltaPM = (((-lon % 360.0) + 540.0) % 360.0) - 180.0; // [-180, 180]
          var pmFront = Math.abs(deltaPM) <= 90.0;
          var foldedDeg = deltaPM;
          if (deltaPM > 90.0) foldedDeg = 180.0 - deltaPM;
          else if (deltaPM < -90.0) foldedDeg = -180.0 - deltaPM;

          // Scaled stereographic-style horizontal offset so longitudes near ±90° remain clearly visible inside the rim
          var pmRatio = Math.sin((foldedDeg * 0.78 * Math.PI) / 180.0);
          var rxPM = Math.abs(earthR * pmRatio);
          if (rxPM < 0.3) {
            pmPath.setAttribute("d", "M 0 -30 L 0 30");
          } else {
            var sweepPM = pmRatio >= 0 ? 1 : 0;
            pmPath.setAttribute(
              "d",
              "M 0 -30 A " + rxPM.toFixed(2) + " 30 0 0 " + sweepPM + " 0 30",
            );
          }
          pmPath.setAttribute("stroke-dasharray", pmFront ? "0" : "1.8, 1.8");
          pmPath.setAttribute(
            "stroke",
            pmFront ? "rgba(255, 75, 75, 0.8)" : "rgba(255, 75, 75, 0.4)",
          );
        }

        // 3. Recalculate Non-Circular Sun Travelling Path & Current Yellow Sun Dot
        var maxOrbitR = 26.5;
        var isDaytime = nowMin >= sunriseMin && nowMin < sunsetMin;
        var curSunPt = calcEarthSunPoint(
          sunAzimuth,
          sunPos.elevation,
          yLoc,
          maxOrbitR,
        );

        var compassDot = document.getElementById("compassDot");
        compassDot.setAttribute("cx", curSunPt.x.toFixed(2));
        compassDot.setAttribute("cy", curSunPt.y.toFixed(2));
        compassDot.setAttribute("opacity", isDaytime ? "0.95" : "0.35");

        var compassRadiusLine = document.getElementById("compassRadiusLine");
        if (compassRadiusLine) {
          compassRadiusLine.setAttribute("x1", "0");
          compassRadiusLine.setAttribute("y1", yLoc.toFixed(2));
          compassRadiusLine.setAttribute("x2", curSunPt.x.toFixed(2));
          compassRadiusLine.setAttribute("y2", curSunPt.y.toFixed(2));
          compassRadiusLine.setAttribute("opacity", isDaytime ? "0.85" : "0.3");
        }

        // Build non-circular daytime trajectory curve from Sunrise to Sunset on the globe
        var earthSunPathEl = document.getElementById("earthSunPath");
        var earthSunPathActiveEl =
          document.getElementById("earthSunPathActive");
        if (earthSunPathEl && earthSunPathActiveEl) {
          var pathSamples = 24;
          var fullCurveD = "";
          var activeCurveD = "";
          var yrNow = now.getFullYear();
          var moNow = now.getMonth();
          var dyNow = now.getDate();

          for (var s = 0; s <= pathSamples; s++) {
            var sampleMin = sunriseMin + (totalDay * s) / pathSamples;
            var sSec = Math.round(sampleMin * 60);
            var sDate = new Date(
              yrNow,
              moNow,
              dyNow,
              Math.floor(sSec / 3600),
              Math.floor((sSec % 3600) / 60),
              sSec % 60,
            );
            var sPos = calcSunPosition(lat, lon, tz, sDate);
            var sPt = calcEarthSunPoint(
              sPos.azimuth,
              sPos.elevation,
              yLoc,
              maxOrbitR,
            );
            var cmd = s === 0 ? "M " : " L ";
            fullCurveD += cmd + sPt.x.toFixed(1) + " " + sPt.y.toFixed(1);
            if (isDaytime && sampleMin <= nowMin) {
              activeCurveD += cmd + sPt.x.toFixed(1) + " " + sPt.y.toFixed(1);
            }
          }
          if (isDaytime && activeCurveD !== "") {
            activeCurveD +=
              " L " + curSunPt.x.toFixed(1) + " " + curSunPt.y.toFixed(1);
          }
          earthSunPathEl.setAttribute("d", fullCurveD);
          earthSunPathActiveEl.setAttribute(
            "d",
            isDaytime ? activeCurveD : "M 0 0",
          );
        }

        // 4. Live 3D Spherical Day & Night Shadow (passes through off-center Green Dot at Sunrise/Sunset)
        var nightPath = document.getElementById("earthNightPath");
        var terminatorPath = document.getElementById("earthTerminator");
        if (nightPath && terminatorPath) {
          var decl = sunPos.decl;
          var haRad = sunPos.haRad;

          // 3D unit vector to Sun in globe frame (+X: East, -Y: North, +Z: Observer Meridian)
          var Sx = -Math.cos(decl) * Math.sin(haRad);
          var Sy = -Math.sin(decl);
          var Sz = Math.cos(decl) * Math.cos(haRad);
          var rho = Math.sqrt(Sx * Sx + Sy * Sy);
          var Rpad = earthR + 1.0;

          if (rho < 0.001) {
            if (Sz >= 0) {
              nightPath.setAttribute("d", "M 0 0");
              terminatorPath.setAttribute("d", "M 0 0");
            } else {
              nightPath.setAttribute(
                "d",
                "M -31 -31 L 31 -31 L 31 31 L -31 31 Z",
              );
              terminatorPath.setAttribute("d", "M 0 0");
            }
          } else {
            var ux = Sx / rho;
            var uy = Sy / rho;
            var vx = -uy;
            var vy = ux;

            var termPts = 20;
            var termD = "";
            for (var k = 0; k <= termPts; k++) {
              var theta = (Math.PI * k) / termPts;
              var cosT = Math.cos(theta);
              var sinT = Math.sin(theta);
              var tx = Rpad * cosT * vx - Rpad * Sz * sinT * ux;
              var ty = Rpad * cosT * vy - Rpad * Sz * sinT * uy;
              termD +=
                (k === 0 ? "M " : " L ") + tx.toFixed(2) + " " + ty.toFixed(2);
            }

            // Close polygon around the night hemisphere limb (-u direction)
            var nightD = termD;
            var limbPts = 12;
            for (var m = 1; m <= limbPts; m++) {
              var phiL = Math.PI + (Math.PI * m) / limbPts;
              var lx = Rpad * Math.cos(phiL) * vx + Rpad * Math.sin(phiL) * ux;
              var ly = Rpad * Math.cos(phiL) * vy + Rpad * Math.sin(phiL) * uy;
              nightD += " L " + lx.toFixed(2) + " " + ly.toFixed(2);
            }
            nightD += " Z";

            nightPath.setAttribute("d", nightD);
            terminatorPath.setAttribute("d", termD);
          }
        }

        progress = Math.max(0, Math.min(1, progress));

        var t = progress;
        var x = (1 - t) * (1 - t) * 15 + 2 * (1 - t) * t * 150 + t * t * 285;
        var y = (1 - t) * (1 - t) * 140 + 2 * (1 - t) * t * -40 + t * t * 140;

        sunDot.setAttribute("cx", x.toFixed(1));
        sunDot.setAttribute("cy", y.toFixed(1));
        sunGlow.setAttribute("cx", x.toFixed(1));
        sunGlow.setAttribute("cy", y.toFixed(1));
        sunGlowOuter.setAttribute("cx", x.toFixed(1));
        sunGlowOuter.setAttribute("cy", y.toFixed(1));

        if (progress > 0 && progress < 1) {
          var pathD = "M 15 140";
          var steps = Math.max(1, Math.round(t * 50));
          for (var i = 1; i <= steps; i++) {
            var st = (t * i) / steps;
            var sx =
              (1 - st) * (1 - st) * 15 +
              2 * (1 - st) * st * 150 +
              st * st * 285;
            var sy =
              (1 - st) * (1 - st) * 140 +
              2 * (1 - st) * st * -40 +
              st * st * 140;
            pathD += " L " + sx.toFixed(1) + " " + sy.toFixed(1);
          }
          arcActive.setAttribute("d", pathD);
          arcActive.setAttribute("opacity", "0.6");
          sunDot.setAttribute("opacity", "0.95");
          sunGlow.setAttribute("opacity", "0.2");
          sunGlowOuter.setAttribute("opacity", "0.08");
          svgEl.classList.remove("sun-glow-off");
        } else if (progress >= 1) {
          arcActive.setAttribute("d", "M 15 140 Q 150 -40 285 140");
          arcActive.setAttribute("opacity", "0.2");
          sunDot.setAttribute("opacity", "0.3");
          sunGlow.setAttribute("opacity", "0.05");
          sunGlowOuter.setAttribute("opacity", "0");
          svgEl.classList.add("sun-glow-off");
        } else {
          arcActive.setAttribute("d", "M 0 0");
          arcActive.setAttribute("opacity", "0");
          sunDot.setAttribute("opacity", "0.4");
          sunGlow.setAttribute("opacity", "0.08");
          sunGlowOuter.setAttribute("opacity", "0");
          svgEl.classList.add("sun-glow-off");
        }
      }
